# ------------------------------------------------------------------------------------------------------------------
# EP (edge-decode pivot) machines and controls, docs/. All derived from PS-BASE-S0
# (= E1, the edge machine; its string is repeated with one definition per macro). E4 = PS-BASE-S1-4c (unchanged).
# Controls are NEVER machines: they only bound what a memory-side mechanism could save (methodology §18.2).
#   L2big:   64 MiB L2 (holds the largest W_EP matrix, 36.9 MB) AND -DVX_CFG_L2_LATENCY=4. Why the second macro:
#            VX_config.toml:256 sets L2_LATENCY = 4 + max(0, clog2(L2_SIZE) - clog2(1 MiB)), the SimX L2 pipeline
#            latency (sim/simx/cluster.cpp:84): 4 cycles at E1's 256 KiB but 10 at 64 MiB. The generated VX_config.h
#            wraps the macro in #ifndef, so pinning it to E1's value makes the control change capacity only
#            (confirmed chase probe, results/<run>/README.md).
#   -P:      + -DPS_ALLOW_PERSIST_L2=1 (host-side allow macro of the persist_l2 knob, through CONFIGS as
#            experiments/<run>.yaml:27) for the resident (C_res) two-launch runs.
#   lat190:  E1 with the a100-profile fixed DRAM latency 190 (sensitivity only; never decides a gate).
EP-S0-lat190:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_MUFU_ENABLE -DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2 -DVX_CFG_L2_SIZE=262144 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=1 -DVX_CFG_PLATFORM_MEMORY_DATA_RATE=400 -DVX_CFG_PLATFORM_MEMORY_LATENCY=190"
  cores: 1
  l2: true
  threads: 32
  warps: 8
  source: "E1-lat190: PS-BASE-S0 with fixed DRAM latency 190 (sensitivity only)"


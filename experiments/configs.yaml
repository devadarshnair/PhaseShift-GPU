# Named SimX CONFIGS sets for scripts/vxrun.py.
#
# Each entry:
#   configs:  extra -D flags passed to ci/blackbox.sh through the CONFIGS environment variable
#   cores / warps / threads / l2:  structural knobs, passed as blackbox flags (--cores=N --warps=N --threads=N
#             --l2cache); blackbox appends them to CONFIGS after the env value, so they win over the same macro in
#             `configs` (vxrun drops such duplicates from `configs` so the string has one definition per macro).
#   source:   where the set comes from.
# The perf class is NOT part of a config set: vxrun always passes --perf=<class> (default 1), which adds -DPERF_ENABLE,
# so every cycle comparison shares one build flavour.
#
# REG-CFG is fixed for the whole project: every no-op regression uses it and it defines
# PS-BASE, every provisional benchmark uses it. Never edit it; add a new name instead.

REG-CFG:
  configs: "-DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2"
  cores: 4
  l2: true
  source: "regression reference config (= smoke case 7 CONFIGS; PLRU = policy 2, VX_config.toml:192-194)"

# Vortex smoke cases. App/args are per run, not part of the set.
smoke-default:
  configs: ""
  source: "smoke cases 1-3 (sgemm -n32, sgemv -m64 -n64, softmax -n64)"

smoke-tcu:
  configs: "-DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DITYPE=fp16 -DOTYPE=fp32"
  source: "smoke case 4 (ci/testcases/tensor.yaml sgemm_tcu-3)"

smoke-dxa:
  configs: "-DVX_CFG_EXT_DXA_ENABLE"
  source: "smoke case 5 (dxa.yaml:11-17), app dxa_copy -d1, perf class 16"

smoke-wgmma-dxa:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1"
  threads: 32
  warps: 8
  source: "smoke case 6 (dxa.yaml:377-385 config, args -m 128 -n 128 -k 64 from :512-513)"

smoke-l2-plru-4c:
  configs: "-DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2"
  cores: 4
  l2: true
  source: "smoke case 7 (perf class 5); identical CONFIGS to REG-CFG"

# TIER case (simulation-speed tier): smoke case 6 CONFIGS + PLRU on 4 cores with L2. Defines R (cycles/s).
TIER-CFG:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2"
  cores: 4
  l2: true
  threads: 32
  warps: 8
  source: "TIER case (smoke-wgmma-dxa + PLRU, --cores=4 --l2cache --threads=32 --warps=8)"

# ------------------------------------------------------------------------------------------------------------------
# PS-BASE configurations (measured parameters in results/<run>/machine_params.csv;
# reasons per knob in methodology §11). Common core = TIER-CFG's core (NT=32, NW=8, ISSUE_WIDTH=2, TCU + WGMMA with
# WGMMA_NRC=32, DXA, one ALU/LSU/FPU block per core as in ci/testcases/dxa.yaml:377-385) + MUFU + PLRU at L1 and L2,
# L2 on. Per-core resources held constant across S0/S1: L2 = 256 KiB per core, 0.5 DRAM channel (HBM2, 32 B/cycle
# each) per core. NOTE: the Vortex default configuration has NO L2 (VX_CFG_L2_ENABLE = false, VX_config.toml:16);
# every PS-BASE turns it on (--l2cache). Never edit an entry once results exist; add a new name instead.
PS-BASE-S1-4c-lat0:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_MUFU_ENABLE -DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2 -DVX_CFG_L2_SIZE=1048576 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=2 -DVX_CFG_PLATFORM_MEMORY_LATENCY=0"
  cores: 4
  l2: true
  threads: 32
  warps: 8
  source: "sensitivity: PS-BASE-S1-4c with the Vortex DEFAULT DRAM latency (0 fixed cycles); = TIER-CFG + MUFU"

# reference only (NOT a baseline): the PS-BASE core with the a100 profile's DRAM and cache-size keys
# (third_party/vortex/profiles/a100.json: clock 1410 MHz, HBM2 at 3038 MT/s, fixed DRAM latency 190 cycles from
# GPGPU-Sim's SM80_A100 config per the profile's sources field, L2 32 MiB 16-way, L1 128 KiB), used to measure SimX's unloaded a100-like miss
# latency L0 in core cycles for the dimensionless latency-hiding ratio (methodology §11).
P3.1-a100lat-ref:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_MUFU_ENABLE -DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2 -DVX_CFG_L2_SIZE=33554432 -DVX_CFG_L2_NUM_WAYS=16 -DVX_CFG_DCACHE_SIZE=131072 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=2 -DVX_CFG_PLATFORM_CLOCK_RATE=1410 -DVX_CFG_PLATFORM_MEMORY_DATA_RATE=3038 -DVX_CFG_PLATFORM_MEMORY_LATENCY=190"
  cores: 4
  l2: true
  threads: 32
  warps: 8
  source: "latency reference (a100 profile memory/cache keys on the PS-BASE core); not a baseline"

# PS-BASE baselines (decision): fixed DRAM latency 11 core cycles, chosen so the
# measured latency-hiding ratio rho = L0 x ISSUE_WIDTH / NUM_WARPS (unloaded DRAM-miss load latency per warp per issue
# slot) equals the a100-like value measured on SimX (P3.1-a100lat-ref); methodology §11.
# Assumptions: rho uses the MAXIMUM resident warps (a100 64/SM, PS-BASE 8/core) and rho ~ 1/occupancy,
# so +11 is the low-latency end if A100 LLM kernels run below 64 warps; -lat190 equals an a100 at ~20 resident warps/SM.
# The a100 L0 is a SimX value (4 cores, 2 channels), not an A100 measurement; h100's profile latency is "not calibrated". L2 = 256 KiB/core, 0.5 HBM2
# channel/core (both held per core across S0 and S1). Vortex default has NO L2 (VX_config.toml:16): PS-BASE turns it on.
PS-BASE-S0:
  configs: "-DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1 -DVX_CFG_EXT_MUFU_ENABLE -DVX_CFG_DCACHE_REPL_POLICY=2 -DVX_CFG_L2_REPL_POLICY=2 -DVX_CFG_L2_SIZE=262144 -DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=1 -DVX_CFG_PLATFORM_MEMORY_DATA_RATE=400 -DVX_CFG_PLATFORM_MEMORY_LATENCY=11"
  cores: 1
  l2: true
  threads: 32
  warps: 8
  source: "PS-BASE tiny tier S0 (1 core; RTL/SAIF scale, methodology §7); one HBM2 channel at HALF the default data rate (400 MT/s = 16 B/cycle) keeps the S1 bandwidth per core (16 B/cycle)"

PS-BASE-S1-4c:
